[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procrafiler"
version = "0.2.0"
description = "Autonomous file classification assistant for Linux, with strong operational guardrails"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Simon LM" }
]
license = { file = "LICENSE.md" }
keywords = ["linux", "ubuntu", "file-management", "classification", "ai-assistant"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11"
]
dependencies = [
  "pypdf>=6,<7",
  "Pillow>=10,<12",
  "PyMuPDF>=1.24,<2",
]

[project.urls]
Homepage = "https://simon-lm.dev"
Repository = "https://github.com/Simon-LM"

[project.scripts]
procrafiler = "procrafiler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
