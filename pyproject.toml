[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procrafiler"
dynamic = ["version"]  # derived from the latest git tag by setuptools-scm — never hardcoded
description = "Autonomous file classification assistant for Linux, with strong operational guardrails"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Simon LM" }
]
license = { file = "LICENSE.md" }
keywords = ["linux", "ubuntu", "file-management", "classification", "ai-assistant"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11"
]
dependencies = [
  "pypdf>=6,<7",
  "Pillow>=10,<12",
  "PyMuPDF>=1.24,<2",
  "cryptography>=42,<46",
]

[project.urls]
Homepage = "https://simon-lm.dev"
Repository = "https://github.com/Simon-LM"

[project.scripts]
procrafiler = "procrafiler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# The version IS the latest git tag (e.g. v0.3.3 → 0.3.3); a dev checkout ahead of
# a tag gets a `.devN+g<hash>` suffix. fallback_version keeps a non-git build
# (e.g. a source tarball without history) from failing.
fallback_version = "0.0.0"
